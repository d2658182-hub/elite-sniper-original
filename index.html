    <script>
        var canvas, stage, exportRoot, anim_container, fnStartAnimation, loader, loading_img, loader_txt;

        function init() {
            canvas = document.getElementById("canvas");
            anim_container = document.getElementById("animation_container");
            var comp = AdobeAn.getComposition("28B497B60847774D94E996E7A9D3CF54");
            var lib = comp.getLibrary();
            loader = new createjs.LoadQueue(false);
            loader.addEventListener("fileload", function(evt) {
                handleFileLoad(evt, comp)
            });
            loader.addEventListener("complete", function(evt) {
                handleComplete(evt, comp)
            });
            var lib = comp.getLibrary();
            loader.loadManifest(lib.properties.manifest);
        }

        function handleFileLoad(evt, comp) {
            var images = comp.getImages();
            if (evt && (evt.item.type == "image")) {
                images[evt.item.id] = evt.result;
            }
            var p = Math.floor((loader._numItemsLoaded / loader._numItems) * 100);
            loading_img = document.getElementById("load_img");
            loading_img.style.top = "-50px";
            loader_txt = document.getElementById("load_txt");
            loader_txt.style.font = "normal bold 13px arial,serif";
            loader_txt.style.textAlign = "center";
            loader_txt.innerHTML = "" + p + "%";
            loader_txt.style.fontWeight = "bold";
            loader_txt.style.top = document.documentElement.clientHeight / 2 + 30 + "px";
        }

        function handleComplete(evt, comp) {
            //This function is always called, irrespective of the content. You can use the variable "stage" after it is created in token create_stage.
            var lib = comp.getLibrary();
            var ss = comp.getSpriteSheet();
            var queue = evt.target;
            var ssMetadata = lib.ssMetadata;
            for (i = 0; i < ssMetadata.length; i++) {
                ss[ssMetadata[i].name] = new createjs.SpriteSheet({
                    "images": [queue.getResult(ssMetadata[i].name)],
                    "frames": ssMetadata[i].frames
                })
            }
            anim_container.style.backgroundColor = '#ffffff';
            loading_img.style.display = 'none';
            loader_txt.style.display = 'none';
            canvas.style.display = 'block';
            exportRoot = new lib.assets();
            stage = new lib.Stage(canvas);
            //Registers the "tick" event listener.
            fnStartAnimation = function() {
                stage.addChild(exportRoot);
                createjs.Ticker.setFPS(lib.properties.fps);
                createjs.Ticker.addEventListener("tick", stage);
            }
            //Code to support hidpi screens and responsive scaling. FIX mobile rotation + white bars (vs CrazyGames)
            function makeResponsive(isResp, respDim, isScale, scaleType) {
                var lastW, lastH, lastS = 1;
                window.addEventListener('resize', resizeCanvas);
                window.addEventListener('orientationchange', function(){ setTimeout(resizeCanvas, 300); });
                // toggle landscape prompt on resize like CrazyGames wrapper
                window.addEventListener('resize', function(){
                    if(exportRoot && exportRoot.landscape_mc){
                        // portrait -> show, landscape -> hide (identique CrazyGames orientation: LANDSCAPE)
                        var isPortrait = window.innerHeight > window.innerWidth;
                        exportRoot.landscape_mc.visible = isPortrait && window.__IS_MOBILE;
                    }
                });
                resizeCanvas();

                function resizeCanvas() {
                    var w = lib.properties.width,
                        h = lib.properties.height;
                    // use visualViewport if available (iOS Safari), fallback to innerWidth/innerHeight, fallback to clientWidth
                    var iw = (window.visualViewport && window.visualViewport.width) || window.innerWidth || document.documentElement.clientWidth,
                        ih = (window.visualViewport && window.visualViewport.height) || window.innerHeight || document.documentElement.clientHeight;
                    var pRatio = window.devicePixelRatio || 1,
                        xRatio = iw / w,
                        yRatio = ih / h,
                        sRatio = 1;
                    if (isResp) {
                        if ((respDim == 'width' && lastW == iw) || (respDim == 'height' && lastH == ih)) {
                            sRatio = lastS;
                        } else if (!isScale) {
                            if (iw < w || ih < h)
                                sRatio = Math.min(xRatio, yRatio);
                        } else if (scaleType == 1) {
                            sRatio = Math.min(xRatio, yRatio);
                        } else if (scaleType == 2) {
                            sRatio = Math.max(xRatio, yRatio);
                        }
                    }
                    canvas.width = w * pRatio * sRatio;
                    canvas.height = h * pRatio * sRatio;
                    canvas.style.width = anim_container.style.width = w * sRatio + 'px';
                    canvas.style.height = anim_container.style.height = h * sRatio + 'px';
                    var bg_container = document.getElementById("container_background");
                    bg_container.style.width = iw + 'px';
                    bg_container.style.height = ih + 'px';
                    stage.scaleX = pRatio * sRatio;
                    stage.scaleY = pRatio * sRatio;
                    lastW = iw;
                    lastH = ih;
                    lastS = sRatio;
                    stage.tickOnUpdate = false;
                    stage.update();
                    stage.tickOnUpdate = true;
                }
            }
            makeResponsive(true, 'both', true, 1);
            AdobeAn.compositionLoaded(lib.properties.id);
            fnStartAnimation();
        }
    </script>
